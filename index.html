function detail(reframe){
  const p = POS.find(x=>x.id===SEL);
  if (!p){ $('#detail').dataset.key = ''; $('#detail').innerHTML = `<div class="panel empty">${POS.length?'SELECT A POSITION':'NO OPEN POSITIONS — NOTHING TO CHART YET'}</div>`; return; }
  const c = cur(p), lv = LIVE[p.id], pr = lv && lv.pair, t = tgt(p), m = move(p,c.v), g = progress(p,c.v);
  const fomo = p.chain && p.address ? `https://fomo.family/tokens/${encodeURIComponent(p.chain)}/${encodeURIComponent(p.address)}` : null;
  const ds = p.chain && p.pairAddress ? `https://dexscreener.com/${encodeURIComponent(p.chain)}/${encodeURIComponent(p.pairAddress)}` : null;
  const ch = x => pr && pr.priceChange ? pct(pr.priceChange[x]) : '—';
  const fkey = p.id+'|'+(p.chain||'')+'|'+(p.pairAddress||'');
  if (reframe || !$('#chartbox') || $('#detail').dataset.key !== fkey){ $('#detail').dataset.key = fkey;
    $('#detail').innerHTML = `<div class="dh"><div class="t">${esc(p.token)}<small>${esc(pr? pr.baseToken.name : '')} · ${esc(p.chain||'unknown chain')}</small></div>
      <div>${fomo?`<a href="${fomo}" target="_blank">FOMO ↗</a>`:'<span class="dim">FOMO link n/a</span>'} &nbsp; ${ds?`<a href="${ds}" target="_blank">DEXSCREENER ↗</a>`:'<span class="dim">DexScreener n/a</span>'}</div></div>
      <div class="warn" id="warn"></div>
      <div class="chartbox" id="chartbox">${ds?`<div class="ph">LOADING LIVE CHART…</div><iframe src="${ds}?embed=1&theme=dark&trades=0&info=0" loading="lazy"></iframe>`:'<div class="ph">NO PAIR ADDRESS STORED FOR THIS POSITION — CHART UNAVAILABLE<br><small>set it with: ledger.py token ID --chain C --address A --pair P</small></div>'}</div>
      <div id="dstats"></div>`;
  }
  const warn = $('#warn');
  if (!ds){ warn.className='warn on'; warn.textContent='NO CHAIN/PAIR STORED — LIVE FEED UNAVAILABLE FOR THIS POSITION. SHOWING LEDGER VALUES.'; }
  else if (lv && !lv.ok){ warn.className='warn on'; warn.textContent = `LIVE FEED UNAVAILABLE — SHOWING LAST KNOWN VALUES${lv.ts?' FROM '+tsBkk(lv.ts)+' (BKK)':''}${lv.err?' · '+lv.err:''}` + (location.protocol==='file:'?' · OPENED AS A LOCAL FILE: DEXSCREENER API REJECTS file:// ORIGINS. SERVE OVER HTTP: python3 -m http.server 8765 IN THIS FOLDER, THEN OPEN http://127.0.0.1:8765/app.html':''); }
  else if (!lv){ warn.className='warn on'; warn.textContent='WAITING FOR LIVE FEED… SHOWING LEDGER VALUES'; }
  else warn.className='warn';
  const mk = v => g==null ? 0 : v;
  $('#dstats').innerHTML = `
  <div class="stats">
    <div class="st"><span class="lbl">Price</span><b>${pr?px(pr.priceUsd):'—'}</b></div>
    <div class="st"><span class="lbl">Market cap</span><b>${pr?big(pr.marketCap ?? pr.fdv):'—'}</b></div>
    <div class="st"><span class="lbl">5m / 1h</span><b>${ch('m5')} <span class="dim">/</span> ${ch('h1')}</b></div>
    <div class="st"><span class="lbl">24h</span><b>${ch('h24')}</b></div>
    <div class="st"><span class="lbl">Liquidity</span><b>${pr&&pr.liquidity?big(pr.liquidity.usd):'—'}</b></div>
    <div class="st"><span class="lbl">Vol 24h</span><b>${pr&&pr.volume?big(pr.volume.h24):'—'}</b></div>
  </div>
  <div class="panel"><div class="lbl" style="display:flex;justify-content:space-between"><span>Position · SL ↔ TP</span><span>${c.src==='live'?'<span class="g">● LIVE</span>':esc(c.src.toUpperCase())}${c.ts?' · '+tsBkk(c.ts):''}</span></div>
    <div class="prog"><div class="z" style="left:0;width:${100*(-SL)/(TP-SL)}%;background:#ff4d4d22"></div><div class="z" style="left:${100*(-SL)/(TP-SL)}%;right:0;background:#39ff8822"></div>
      <div class="mk" style="left:${100*(-SL)/(TP-SL)}%;background:#888;width:1px"></div>
      ${g==null?'':`<div class="mk" style="left:calc(${g*100}% - 1px)"></div><span class="lab u" style="left:${g*100}%">NOW ${fmtBasis(p,c.v)} (${m>0?'+':''}${m.toFixed(2)}%)</span>`}
      <span class="lab d r" style="left:0;transform:none">SL ${fmtBasis(p,t.sl)} (${SL}%)</span><span class="lab d dim" style="left:${100*(-SL)/(TP-SL)}%">ENTRY ${fmtBasis(p,p.entry_price)}</span><span class="lab d g" style="right:0;left:auto;transform:none">TP ${fmtBasis(p,t.tp)} (+${TP}%)</span></div>
    <div class="kv">
      <div><span>Entry ${isMC(p)?'MC':'price'}</span><span>${fmtBasis(p,p.entry_price)}</span></div>
      <div><span>Current ${isMC(p)?'MC':'price'}</span><span>${fmtBasis(p,c.v)}</span></div>
      <div><span>From entry</span><span>${pct(m)}</span></div>
      <div><span>Unrealized P/L (net)</span><span>${usd(pnl(p,c.v))}</span></div>
      <div><span>Cost</span><span>${usd(p.cost_usd,false)} · ${C.paper_fee_slippage_pct_each_side}%/side</span></div>
      <div><span>Value if sold now</span><span>${c.v==null?'—':usd(p.cost_usd+pnl(p,c.v),false)}</span></div>
      <div><span>TP target</span><span class="g">${fmtBasis(p,t.tp)}</span></div>
      <div><span>SL target</span><span class="r">${fmtBasis(p,t.sl)}</span></div>
      <div><span>Trader copied</span><span>${esc(p.trader)}</span></div>
      <div><span>Entry time (BKK)</span><span>${esc(p.entry_time)}</span></div>
      <div><span>Chain</span><span>${esc(p.chain)}</span></div>
      <div><span>Contract</span><span title="${esc(p.address)}">${esc(p.address)}</span></div>
      <div><span>Pair</span><span title="${esc(p.pairAddress)}">${esc(p.pairAddress)}</span></div>
      <div><span>Pair DEX</span><span>${pr?esc(pr.dexId+' '+(pr.labels||[]).join(' ')+' · '+pr.baseToken.symbol+'/'+pr.quoteToken.symbol):'—'}</span></div>
      <div><span>Position id</span><span>${esc(p.id)}</span></div>
    </div>${p.match_note?`<div class="sub" style="margin-top:8px;text-transform:none">match: ${esc(p.match_note)}</div>`:''}</div>`;
}
function closed(){
  $('#closed').innerHTML = TR.length ? `<table><tr><th>Token</th><th>Trader</th><th>Chain</th><th>Entry time</th><th>Entry</th><th>Exit time</th><th>Exit</th><th>Move</th><th>Reason</th><th class="rt">Realized P/L</th></tr>${
    TR.slice().reverse().map(t=>`<tr><td><b>${esc(t.token)}</b></td><td>${esc(t.trader)}</td><td>${esc(t.chain)}</td><td class="dim">${esc(t.entry_time)}</td><td>${fmtBasis(t,t.entry_price)}</td><td class="dim">${esc(t.exit_time)}</td><td>${fmtBasis(t,t.exit_price)}</td><td>${pct(move(t,t.exit_price))}</td><td><span class="tag t${esc(t.reason)}">${esc(t.reason)}</span></td><td class="rt">${usd(t.pnl_usd)}</td></tr>`).join('')}</table>`
    : '<div class="empty">NO CLOSED TRADES YET</div>';
}
function activity(){
  const ev = [];
  TR.forEach(t => { ev.push([t.entry_time,t.trader,'BUY',null,t.token]); ev.push([t.exit_time,t.trader,t.reason,t.pnl_usd,t.token]); });
  POS.forEach(p => ev.push([p.entry_time,p.trader,'BUY',null,p.token]));
  ev.sort((a,b)=>String(b[0]).localeCompare(String(a[0])));
  $('#n-act').textContent = ev.length;
  $('#act').innerHTML = ev.length ? `<table><tr><th>Time (BKK)</th><th>Trader</th><th>Action</th><th>Token</th><th class="rt">P/L</th></tr>${ev.map(e=>`<tr><td class="dim">${esc(e[0])}</td><td>${esc(e[1])}</td><td><span class="tag t${esc(e[2])}">${esc(e[2])}</span></td><td>${esc(e[4])}</td><td class="rt">${e[3]==null?'<span class="dim">$'+C.size.usd_per_buy+' in</span>':usd(e[3])}</td></tr>`).join('')}</table>` : '<div class="empty">NO ACTIVITY YET</div>';
}
function cfgView(){
  const rows = [['Mode',C.mode],['Allowlist ('+C.allowlist.length+')',C.allowlist.join(', ')],['Size','$'+C.size.usd_per_buy+' flat per buy'],['Take-profit','+'+TP+'% from entry'],['Stop-loss',SL+'% from entry'],['Exit rule',C.exits.rule],['Risk caps',C.risk_caps||'none'],['Paper fee/slippage',C.paper_fee_slippage_pct_each_side+'% each side'],['Paper starting balance','$'+START],['Timezone',C.timezone]];
  $('#cfgv').innerHTML = `<table>${rows.map(r=>`<tr><td class="dim">${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>`;
}
function header(){
  const dot = $('#dot'), t = $('#livetxt'), any = POS.some(p=>p.chain&&p.pairAddress);
  if (!POS.length){ dot.className='dot'; t.textContent='NO OPEN POSITIONS'; }
  else if (!any){ dot.className='dot off'; t.textContent='NO PAIRS TO TRACK'; }
  else if (feedState==='ok'){ dot.className='dot on'; t.textContent='LIVE · '+tsBkk(lastOk).slice(11); }
  else if (feedState==='err'){ dot.className='dot off'; t.textContent='LIVE FEED UNAVAILABLE'; }
  else { dot.className='dot'; t.textContent='CONNECTING'; }
}
async function poll(){
  const tracked = POS.filter(p=>p.chain&&p.pairAddress); if (!tracked.length){ header(); return true; }
  let okAny = false, errAny = false;
  await Promise.all(tracked.map(async p => {
    try {
      const r = await fetch(`https://api.dexscreener.com/latest/dex/pairs/${encodeURIComponent(p.chain)}/${encodeURIComponent(p.pairAddress)}`, {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json(); const pair = (j.pairs||[]).find(x=>x.pairAddress.toLowerCase()===p.pairAddress.toLowerCase()) || (j.pairs||[])[0] || j.pair;
      if (!pair) throw new Error('pair not found');
      LIVE[p.id] = {pair, ts: Date.now(), ok: true}; okAny = true;
    } catch(e){ errAny = true; let m = String(e.message||e); if (m==='Failed to fetch') m += ' (network/CORS or API rate limit — HTTP 429 has no CORS header)'; LIVE[p.id] = Object.assign(LIVE[p.id]||{}, {ok:false, err:m}); }
  }));
  if (okAny && !errAny){ feedState='ok'; lastOk=Date.now(); } else if (errAny) feedState='err';
  try { localStorage.setItem('fomo_live', JSON.stringify(LIVE)); } catch(e){}
  header(); cards(); list(); detail(false);
  return !errAny;
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b)); document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+b.dataset.v)); });
function statics(){
  $('#lastrun').textContent = L.last_run || 'NEVER'; $('#books').textContent = C.allowlist.length; $('#tpc').textContent = '+'+TP+'%'; $('#slc').textContent = SL+'%'; $('#feec').textContent = C.paper_fee_slippage_pct_each_side;
  $('#n-pos').textContent = POS.length; $('#n-closed').textContent = TR.length;
  $('#datasrc').textContent = DATASRC + (DATAAT ? ' · ' + tsBkk(DATAAT) : '');
}
function pickSel(){
  const h = location.hash.slice(1);
  if (SEL && POS.some(p=>p.id===SEL)) return;
  SEL = (h && POS.some(p=>p.id===h)) ? h : (POS[0]||{}).id;
}
function renderAll(reframe){ pickSel(); statics(); header(); cards(); list(); detail(reframe); closed(); activity(); cfgView(); }
$('#foot').innerHTML = `<span>page built <b>${esc(DATA.rendered)}</b> BKK</span><span>ledger data <b id="datasrc"></b></span><span>ledger refresh <b id="ledint">30s</b></span><span>live poll <b id="pollint">10s</b> (dexscreener)</span><span>tz <b>${esc(C.timezone)}</b></span>`;
renderAll(true);
const CAN_FETCH_LEDGER = location.protocol === 'http:' || location.protocol === 'https:';
let lastLedgerJson = JSON.stringify(DATA.led) + JSON.stringify(DATA.cfg);
async function refreshLedger(){
  try {
    const t = Date.now();
    const [lr, cr] = await Promise.all([fetch('./ledger.json?t='+t, {cache:'no-store'}), fetch('./config.json?t='+t, {cache:'no-store'})]);
    if (!lr.ok || !cr.ok) throw new Error('HTTP '+lr.status+'/'+cr.status);
    const [led, cfg] = await Promise.all([lr.json(), cr.json()]);
    if (!led || !Array.isArray(led.positions) || !cfg || !cfg.exits) throw new Error('bad ledger/config shape');
    DATASRC = 'live ./ledger.json'; DATAAT = Date.now();
    const k = JSON.stringify(led) + JSON.stringify(cfg);
    if (k !== lastLedgerJson){ lastLedgerJson = k; const hadTracked = POS.map(p=>p.id+p.pairAddress).join(); setData(cfg, led); renderAll(false); if (hadTracked !== POS.map(p=>p.id+p.pairAddress).join()) poll(); }
    else statics();
  } catch(e){ DATASRC = 'refresh failed (' + String(e.message||e) + ') — showing ' + (DATAAT ? 'last fetched' : 'baked-in'); statics(); }
}
if (CAN_FETCH_LEDGER){ refreshLedger(); setInterval(refreshLedger, 30000); }
else { $('#ledint').textContent = 'reload 5 min (local file)'; setTimeout(() => location.reload(), 300000); }
let delay = 10000; (async function loop(){ const ok = await poll(); delay = ok ? 10000 : Math.min(60000, delay*2); $('#pollint').textContent = (delay/1000)+'s'+(ok?'':' (backoff)'); setTimeout(loop, delay); })();
</script></body></html>
